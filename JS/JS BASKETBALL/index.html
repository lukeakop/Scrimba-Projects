<html>
    <head>
        <link href="https://fonts.cdnfonts.com/css/cursed-timer-ulil" rel="stylesheet">
        <link href="https://fonts.cdnfonts.com/css/pp-pangaia" rel="stylesheet">
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div class="container">
            <div>
                <h3>HOME</h3>
                <div class="score" id="home-score">0</div>
                <div class="buttons">
                    <button class="button-incr" onclick="addHomePoints(1)">+1</button>
                    <button class="button-incr" onclick="addHomePoints(2)">+2</button>
                    <button class="button-incr" onclick="addHomePoints(3)">+3</button>
                </div>
            </div>
            <div>
                <h3>GUEST</h3>
                <div class="score" id="guest-score">0</div>
                <div class="buttons">
                    <button class="button-incr" onclick="addGuestPoints(1)">+1</button>
                    <button class="button-incr" onclick="addGuestPoints(2)">+2</button>
                    <button class="button-incr" onclick="addGuestPoints(3)">+3</button>
                </div>
            </div>
        </div>
        <script src="main.js"></script>
    </body>
</html>
